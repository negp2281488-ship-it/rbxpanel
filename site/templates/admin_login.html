<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ APP_NAME }} Admin</title>
    <link rel="icon" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
        @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.1)}66%{transform:translate(-20px,15px) scale(.95)}}

        body{
            font-family:'Inter',system-ui,sans-serif;
            background:#060608;
            min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            padding:20px;overflow:hidden;
        }

        .orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(80px);animation:orbFloat 20s ease-in-out infinite}
        .orb-1{width:400px;height:400px;top:-100px;left:-100px;background:rgba(120,120,140,.06)}
        .orb-2{width:300px;height:300px;bottom:-80px;right:-80px;background:rgba(180,180,200,.04);animation-delay:-7s}

        .login-card{
            width:100%;max-width:400px;
            background:rgba(13,13,16,.8);
            backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
            border:1px solid rgba(255,255,255,.06);
            border-radius:20px;padding:48px 36px 40px;
            position:relative;z-index:1;
            animation:fadeIn .6s cubic-bezier(.16,1,.3,1) forwards;
        }
        .login-card::before{
            content:'';position:absolute;inset:-1px;border-radius:20px;
            background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 50%);
            z-index:-1;pointer-events:none;
        }

        .logo-area{text-align:center;margin-bottom:36px}
        .logo-icon{
            width:56px;height:56px;margin:0 auto 20px;
            background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
            border-radius:16px;display:flex;align-items:center;justify-content:center;
            animation:pulse 3s ease-in-out infinite;
        }
        .logo-icon svg{width:24px;height:24px;stroke:#808090;fill:none;stroke-width:1.5}
        .logo-area h1{font-size:22px;font-weight:600;color:#e0e0e5;letter-spacing:-.5px;margin-bottom:6px}
        .logo-area p{font-size:13px;color:#5a5a65}

        .alert{padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:13px;border:1px solid rgba(255,255,255,.06)}
        .alert-error{background:rgba(255,80,80,.06);color:#ff6b6b;border-color:rgba(255,80,80,.12)}
        .alert-success{background:rgba(255,255,255,.04);color:#a0a0b0;border-color:rgba(255,255,255,.08)}

        .field{margin-bottom:18px}
        .field label{display:block;font-size:12px;color:#5a5a65;font-weight:500;margin-bottom:8px;letter-spacing:.3px}
        .field input{
            width:100%;padding:13px 16px;
            background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
            border-radius:10px;font-size:14px;color:#e0e0e5;font-family:inherit;
            transition:all .3s cubic-bezier(.16,1,.3,1);
        }
        .field input:focus{outline:none;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
        .field input::placeholder{color:#3a3a45}

        .btn{
            width:100%;padding:14px;margin-top:6px;
            background:linear-gradient(135deg,#1a1a20,#2a2a32);
            border:1px solid rgba(255,255,255,.1);border-radius:10px;
            font-size:14px;font-weight:600;color:#e0e0e5;cursor:pointer;
            font-family:inherit;letter-spacing:-.2px;
            transition:all .3s cubic-bezier(.16,1,.3,1);
            position:relative;overflow:hidden;
        }
        .btn:hover{border-color:rgba(255,255,255,.2);box-shadow:0 4px 24px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);transform:translateY(-1px)}
        .btn:active{transform:translateY(0);box-shadow:none}
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);background-size:200% 100%;animation:shimmer 3s infinite}
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="login-card">
        <div class="logo-area">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1>{{ APP_NAME }}</h1>
            <p>Authentication required</p>
        </div>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
        <form method="POST" action="{{ url_for('admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" required autofocus placeholder="Enter username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>
</body>
</html>
